name: Test SofaScore API

on:
  workflow_dispatch:  # lo corrés a mano desde la pestaña "Actions" en GitHub

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test endpoints
        run: |
          echo "=== 1. Info del torneo (Liga Profesional, id 155) ==="
          curl -s -A "Mozilla/5.0" "https://api.sofascore.com/api/v1/unique-tournament/155" | head -c 1000
          echo ""
          echo ""

          echo "=== 2. Temporadas disponibles ==="
          curl -s -A "Mozilla/5.0" "https://api.sofascore.com/api/v1/unique-tournament/155/seasons" | head -c 1500
          echo ""
          echo ""

          echo "=== 3. Próximo partido de River (team 3211) ==="
          curl -s -A "Mozilla/5.0" "https://api.sofascore.com/api/v1/team/3211/events/next/0" | head -c 1500
          echo ""
          echo ""

          echo "=== 4. Último partido de River (para sacar un match_id real) ==="
          curl -s -A "Mozilla/5.0" "https://api.sofascore.com/api/v1/team/3211/events/last/0" | head -c 2000
