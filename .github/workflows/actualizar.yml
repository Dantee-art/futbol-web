name: Actualizar Picks Diarios

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'config/**'

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests
      - name: Regenerar partidos y predicciones
        working-directory: scripts
        run: python actualizar_datos.py
      - name: Guardar datos nuevos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar partidos y predicciones"
          file_pattern: "datos/**"
