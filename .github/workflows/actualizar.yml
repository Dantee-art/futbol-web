name: Actualizar mercados de remates

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'index.html'
      - 'requirements.txt'
      - '.github/workflows/actualizar.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Consultar mercados reales
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m src.collector
      - name: Publicar datos
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Actualizar partidos y líneas reales"
          file_pattern: "data/**"
