name: Actualizar arbitrajes

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'arbitrage/**'
      - 'requirements.txt'
      - '.github/workflows/actualizar.yml'

jobs:
  arbitrage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Buscar oportunidades
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python app.py --refresh
      - name: Publicar resultados
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Actualizar oportunidades de arbitraje"
          file_pattern: "data/**"
