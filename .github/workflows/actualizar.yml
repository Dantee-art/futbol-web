name: Actualizar Picks Diarios

on:
  schedule:
    - cron: '0 9 * * *'   # 9am UTC = 6am Argentina
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar datos de partidos y picks
        working-directory: scripts
        run: python actualizar_datos.py

      - name: Commitear datos actualizados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizacion automatica de picks diarios"
          file_pattern: "datos/**"
