name: Test ESPN API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test player stats keys
        run: |
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.copa/summary?event=401896387" -o /tmp/summary.json

          echo "=== Claves de cada jugador del primer equipo ==="
          python3 -c "import json; d=json.load(open('/tmp/summary.json')); r=d.get('rosters',[]); roster=r[0].get('roster',[]) if r else []; [print(p.get('athlete',{}).get('displayName','?'), '->', list(p.keys())) for p in roster[:23]]"
          echo ""

          echo "=== Buscamos si algun jugador tiene 'stats' o 'statistics' ==="
          python3 -c "import json; d=json.load(open('/tmp/summary.json')); r=d.get('rosters',[]); roster=r[0].get('roster',[]) if r else []; hits=[p for p in roster if 'stats' in p or 'statistics' in p]; print('Jugadores con stats:', len(hits)); [print(p.get('athlete',{}).get('displayName'), json.dumps(p.get('stats', p.get('statistics')), ensure_ascii=False)) for p in hits]"
