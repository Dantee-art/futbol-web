name: Test ESPN API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test endpoints
        run: |
          echo "=== 1. Scoreboard Liga Profesional Argentina (arg.1) ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.1/scoreboard" | head -c 2000
          echo ""
          echo ""

          echo "=== 2. Scoreboard Copa Argentina (arg.copa) ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.copa/scoreboard" | head -c 1500
          echo ""
          echo ""

          echo "=== 3. Standings / tabla (requiere /apis/v2/, no /apis/site/v2/) ==="
          curl -s "https://site.api.espn.com/apis/v2/sports/soccer/arg.1/standings" | head -c 1500
          echo ""
          echo ""

          echo "=== 4. Teams (para sacar IDs de equipos) ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.1/teams" | head -c 1500
          echo ""
          echo ""

          echo "=== 5. Solo los event IDs + nombres de equipos del scoreboard ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.1/scoreboard" | grep -o '"id":"[0-9]*"[^}]*"shortDisplayName":"[^"]*"' | head -30
          echo ""
          echo ""

          echo "=== 6. SUMMARY del partido real (Copa Argentina, event 401896387) — CORNERS Y TARJETAS ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.copa/summary?event=401896387" | grep -oiE '"(name|displayValue|label)":"[^"]*"' | grep -iE 'corner|card|foul|shot|possess|yellow|red' -A1 -B1
          echo ""
          echo ""

          echo "=== 7. Mismo test pero en Premier League (para confirmar que es genérico, no algo raro de AFA) ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard" | grep -o '"id":"[0-9]*"[^}]*"shortDisplayName":"[^"]*"' | head -6
