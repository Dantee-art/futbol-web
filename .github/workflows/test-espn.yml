name: Test ESPN API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test endpoints
        run: |
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.copa/summary?event=401896387" -o /tmp/summary.json

          echo "=== TODOS los 14 eventos, solo tipo + texto (sin recortar) ==="
          python3 -c "import json; d=json.load(open('/tmp/summary.json')); events=d.get('keyEvents', []); [print(i, '|', e.get('type',{}).get('text'), '|', e.get('text')) for i, e in enumerate(events)]"
          echo ""
          echo ""

          echo "=== Buscamos especificamente eventos tipo Yellow Card / Red Card ==="
          python3 -c "import json; d=json.load(open('/tmp/summary.json')); events=d.get('keyEvents', []); cards=[e for e in events if 'card' in str(e.get('type',{}).get('text','')).lower()]; print('Tarjetas encontradas:', len(cards)); [print(json.dumps(c, ensure_ascii=False)[:500]) for c in cards]"
          echo ""
          echo ""

          echo "=== Donde aparece la palabra card 294 veces? mostramos 5 ejemplos de contexto ==="
          grep -o '.\{30\}card.\{30\}' /tmp/summary.json -i | head -5
