name: Test ESPN API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test player stats keys
        run: |
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.copa/summary?event=401896387" -o /tmp/summary.json

          echo "=== Claves de TODOS los jugadores del primer equipo (sin truncar valores) ==="
          python3 -c "
import json
d = json.load(open('/tmp/summary.json'))
r = d.get('rosters', [])
roster = r[0].get('roster', []) if r else []
for p in roster[:23]:
    name = p.get('athlete', {}).get('displayName', '?')
    print(name, '->', list(p.keys()))
"
          echo ""
          echo "=== Buscamos si CUALQUIER jugador tiene la clave 'stats' o 'statistics' ==="
          python3 -c "
import json
d = json.load(open('/tmp/summary.json'))
r = d.get('rosters', [])
roster = r[0].get('roster', []) if r else []
for p in roster:
    if 'stats' in p or 'statistics' in p:
        print('ENCONTRADO en', p.get('athlete', {}).get('displayName'))
        print(json.dumps(p.get('stats', p.get('statistics')), ensure_ascii=False))
"
