name: Test ESPN API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test team schedule (historial completo)
        run: |
          echo "=== Schedule completo de Racing Club (team id 15) ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.1/teams/15/schedule" -o /tmp/schedule.json
          echo "Tamano del archivo:"
          wc -c /tmp/schedule.json
          echo "Claves de primer nivel:"
          python3 -c "import json; d=json.load(open('/tmp/schedule.json')); print(list(d.keys()))"
          echo ""

          echo "=== Cuantos eventos trae events[] ==="
          python3 -c "import json; d=json.load(open('/tmp/schedule.json')); ev=d.get('events',[]); print('Total eventos:', len(ev))"
          echo ""

          echo "=== Cuantos ya jugados (status completed) ==="
          python3 -c "import json; d=json.load(open('/tmp/schedule.json')); ev=d.get('events',[]); jugados=[e for e in ev if e.get('competitions',[{}])[0].get('status',{}).get('type',{}).get('completed')]; print('Jugados:', len(jugados)); [print(e.get('date'), '-', e.get('name'), '-', e.get('competitions',[{}])[0].get('status',{}).get('type',{}).get('description')) for e in jugados[:25]]"
