name: Test ESPN API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test endpoints
        run: |
          echo "=== 1. Scoreboard Liga Profesional Argentina (arg.1) ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.1/scoreboard" | head -c 2000
          echo ""
          echo ""

          echo "=== 2. Scoreboard Copa Argentina (arg.copa) ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.copa/scoreboard" | head -c 1500
          echo ""
          echo ""

          echo "=== 3. Standings / tabla (requiere /apis/v2/, no /apis/site/v2/) ==="
          curl -s "https://site.api.espn.com/apis/v2/sports/soccer/arg.1/standings" | head -c 1500
          echo ""
          echo ""

          echo "=== 4. Teams (para sacar IDs de equipos) ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.1/teams" | head -c 1500
          echo ""
          echo ""

          echo "=== 5. Solo los event IDs + nombres de equipos del scoreboard ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.1/scoreboard" | grep -o '"id":"[0-9]*"[^}]*"shortDisplayName":"[^"]*"' | head -30
          echo ""
          echo ""

          echo "=== 6. SUMMARY del partido real (Copa Argentina, event 401896387) — CORNERS Y TARJETAS ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.copa/summary?event=401896387" | grep -oiE '"(name|displayValue|label)":"[^"]*"' | grep -iE 'corner|card|foul|shot|possess|yellow|red' -A1 -B1
          echo ""
          echo ""

          echo "=== 6b. Mismo partido: buscamos 'card' o 'corner' en TODO el JSON, no solo en statistics ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.copa/summary?event=401896387" -o /tmp/summary.json
          echo "Tamaño del archivo:"
          wc -c /tmp/summary.json
          echo "Ocurrencias de 'card':"
          grep -oi 'card' /tmp/summary.json | wc -l
          echo "Ocurrencias de 'corner':"
          grep -oi 'corner' /tmp/summary.json | wc -l
          echo "Ocurrencias de 'foul':"
          grep -oi 'foul' /tmp/summary.json | wc -l
          echo "Ocurrencias de 'possession':"
          grep -oi 'possession' /tmp/summary.json | wc -l
          echo "Claves de primer nivel del JSON (con python, viene instalado):"
          python3 -c "import json; d=json.load(open('/tmp/summary.json')); print(list(d.keys()))"
          echo ""
          echo ""

          echo "=== 7. Event IDs reales de Premier League (9 digitos) ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard" | grep -oE '"id":"40[0-9]{7}"' | sort -u | head -5
          echo ""
          echo ""

          echo "=== 8. Estructura de keyEvents (tarjetas jugador+minuto) ==="
          python3 -c "
import json
d = json.load(open('/tmp/summary.json'))
events = d.get('keyEvents', [])
print(f'Total de eventos: {len(events)}')
print('--- Primeros 5 eventos completos ---')
for e in events[:5]:
    print(json.dumps(e, ensure_ascii=False)[:500])
    print('---')
"
          echo ""
          echo ""

          echo "=== 9. Estructura de odds / pickcenter (cuotas) ==="
          python3 -c "
import json
d = json.load(open('/tmp/summary.json'))
print('--- odds ---')
print(json.dumps(d.get('odds', 'NO EXISTE'), ensure_ascii=False)[:1000])
print('--- pickcenter ---')
print(json.dumps(d.get('pickcenter', 'NO EXISTE'), ensure_ascii=False)[:1000])
"
          echo ""
          echo ""

          echo "=== 10. Estructura de rosters (por si las tarjetas tambien viven ahi) ==="
          python3 -c "
import json
d = json.load(open('/tmp/summary.json'))
rosters = d.get('rosters', [])
print(f'Cantidad de equipos en rosters: {len(rosters)}')
if rosters:
    print('Claves de un equipo:', list(rosters[0].keys()))
"
