name: Test ESPN API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test player-level stats
        run: |
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.copa/summary?event=401896387" -o /tmp/summary.json

          echo "=== Estructura de boxscore (claves) ==="
          python3 -c "import json; d=json.load(open('/tmp/summary.json')); bx=d.get('boxscore',{}); print('Claves de boxscore:', list(bx.keys()))"
          echo ""

          echo "=== boxscore.players si existe ==="
          python3 -c "import json; d=json.load(open('/tmp/summary.json')); bx=d.get('boxscore',{}); players=bx.get('players', []); print('Equipos en players:', len(players)); print(json.dumps(players[0], ensure_ascii=False)[:1500]) if players else print('NO EXISTE boxscore.players')"
          echo ""

          echo "=== rosters[0].roster[0] jugador de ejemplo ==="
          python3 -c "import json; d=json.load(open('/tmp/summary.json')); r=d.get('rosters', []); roster=r[0].get('roster', []) if r else []; print('Jugadores en roster:', len(roster)); print(json.dumps(roster[0], ensure_ascii=False)[:1500]) if roster else print('vacio')"
