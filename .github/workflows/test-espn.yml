name: Test ESPN API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test endpoints
        run: |
          echo "=== 6b. Descargando el summary del partido (Copa Argentina, event 401896387) ==="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/arg.copa/summary?event=401896387" -o /tmp/summary.json
          echo "Tamano del archivo:"
          wc -c /tmp/summary.json
          echo "Ocurrencias de 'card':"
          grep -oi 'card' /tmp/summary.json | wc -l
          echo "Ocurrencias de 'corner':"
          grep -oi 'corner' /tmp/summary.json | wc -l
          echo "Claves de primer nivel del JSON:"
          python3 -c "import json; d=json.load(open('/tmp/summary.json')); print(list(d.keys()))"
          echo ""
          echo ""

          echo "=== 8. Estructura de keyEvents (tarjetas jugador+minuto) ==="
          python3 -c "import json; d=json.load(open('/tmp/summary.json')); events=d.get('keyEvents', []); print('Total de eventos:', len(events)); [print(json.dumps(e, ensure_ascii=False)[:400], '\n---') for e in events[:6]]"
          echo ""
          echo ""

          echo "=== 9. Estructura de odds / pickcenter (cuotas) ==="
          python3 -c "import json; d=json.load(open('/tmp/summary.json')); print('ODDS:', json.dumps(d.get('odds', 'NO EXISTE'), ensure_ascii=False)[:800])"
          python3 -c "import json; d=json.load(open('/tmp/summary.json')); print('PICKCENTER:', json.dumps(d.get('pickcenter', 'NO EXISTE'), ensure_ascii=False)[:800])"
          echo ""
          echo ""

          echo "=== 10. Estructura de rosters ==="
          python3 -c "import json; d=json.load(open('/tmp/summary.json')); r=d.get('rosters', []); print('Cantidad de equipos:', len(r)); print('Claves:', list(r[0].keys()) if r else 'vacio')"
