<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101712"><title>SCOUTER · Simulador Monte Carlo</title><style>*{box-sizing:border-box}body{margin:0;background:#0d130f;color:#eef4ef;font:14px system-ui;max-width:760px;margin:auto;padding-bottom:40px}.hero{padding:22px 16px;background:linear-gradient(145deg,#294a28,#111a14);border-radius:0 0 24px 24px}.logo{font-size:28px;font-weight:950;font-style:italic}.logo i{color:#83d866;font-style:normal}.muted,.notice{color:#9aa59d;font-size:11px}.panel{margin:12px;background:#172019;border:1px solid #29372e;border-radius:16px;padding:14px}.select{width:100%;background:#0e1510;border:1px solid #334238;color:#fff;border-radius:10px;padding:12px;margin:5px 0}.match{padding:12px 0;border-bottom:1px solid #29372e}.match:last-child{border:0}.teams{font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.metric{background:#101811;border:1px solid #29372e;border-radius:10px;padding:10px}.metric span{display:block;color:#9aa59d;font-size:8px}.metric b{font-size:21px;color:#83d866}.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #29372e;font-size:11px}.pct{color:#83d866;font-weight:950}.back{color:#83d866;text-decoration:none;font-size:11px}.empty{padding:18px;color:#9aa59d;text-align:center}.tag{display:inline-block;background:#65c34d22;color:#83d866;padding:4px 8px;border-radius:15px;font-size:8px;font-weight:900}
</style></head><body><header class="hero"><a class="back" href="../">‹ Volver a SCOUTER</a><div class="logo">SCOUT<i>ER</i></div><div class="muted">SIMULADOR DE REMATES · MONTE CARLO</div><h2>10.000 simulaciones por partido</h2><div class="notice">Modelo ataque/defensa + Poisson o Negative Binomial. Los resultados se generan automáticamente con el histórico oficial; no se muestran números inventados.</div></header><section class="panel"><select id="match" class="select"><option>Cargando simulaciones...</option></select></section><section id="out" class="panel"><div class="empty">Esperando datos oficiales de GitHub Actions.</div></section><script>
let data=null;const $=s=>document.querySelector(s);function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])}function render(i){let m=data.matches[i],d=m.data,e=d.expected,p=d.probabilities;$('#out').innerHTML=`<span class="tag">10.000 ITERACIONES</span><h3>${esc(m.home)} vs ${esc(m.away)}</h3><div class="grid"><div class="metric"><span>REMATES · LOCAL</span><b>${e.home_shots}</b></div><div class="metric"><span>REMATES · VISITANTE</span><b>${e.away_shots}</b></div><div class="metric"><span>AL ARCO · LOCAL</span><b>${e.home_sot}</b></div><div class="metric"><span>AL ARCO · VISITANTE</span><b>${e.away_sot}</b></div></div><h4>PROBABILIDADES</h4>${Object.entries(p).map(([k,v])=>`<div class="line"><span>${label(k)}</span><b class="pct">${v}%</b></div>`).join('')}<h4>RANGOS MÁS FRECUENTES · AL ARCO</h4>${Object.entries(d.sot_ranges).map(([k,v])=>`<div class="line"><span>${k} remates al arco</span><b class="pct">${v}%</b></div>`).join('')}`}
function label(k){return {'total_shots_over_20_5':'Remates totales +20.5','total_shots_over_25_5':'Remates totales +25.5','total_sot_over_5_5':'Remates al arco +5.5','total_sot_over_7_5':'Remates al arco +7.5','home_shots_over_10_5':'Local +10.5 remates','away_shots_over_10_5':'Visitante +10.5 remates','home_sot_over_2_5':'Local +2.5 al arco','away_sot_over_2_5':'Visitante +2.5 al arco'}[k]||k}async function init(){try{let r=await fetch('../datos/simulaciones_hoy.json?'+Date.now());if(!r.ok)throw Error();data=await r.json();let s=$('#match');s.innerHTML=data.matches.length?data.matches.map((m,i)=>`<option value="${i}">${esc(m.home)} vs ${esc(m.away)}</option>`).join(''):'<option>No hay simulaciones disponibles</option>';if(data.matches.length){render(0);s.onchange=()=>render(Number(s.value))}else $('#out').innerHTML='<div class="empty">No hay partidos con 20 datos verificables todavía.</div>'}catch(e){$('#out').innerHTML='<div class="empty">Todavía no se generaron simulaciones oficiales. Ejecutá la Action de actualización y volvé a entrar.</div>'}}init();
</script></body></html>
