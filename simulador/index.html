<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101712"><title>SCOUTER · Simulador Monte Carlo</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d130f;color:#eef4ef;font:14px system-ui;max-width:760px;margin:auto;padding-bottom:40px}.hero{padding:22px 16px;background:linear-gradient(145deg,#294a28,#111a14);border-radius:0 0 24px 24px}.logo{font-size:28px;font-weight:950;font-style:italic}.logo i{color:#83d866;font-style:normal}.muted{color:#9aa59d;font-size:11px}.panel{margin:12px;background:#172019;border:1px solid #29372e;border-radius:16px;padding:14px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.input{width:100%;background:#0e1510;border:1px solid #334238;color:#fff;border-radius:10px;padding:12px}.run{width:100%;margin-top:10px;border:0;border-radius:10px;padding:13px;background:#65c34d;color:#081008;font-weight:950}.mc{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#101811;border:1px solid #29372e;border-radius:11px;padding:12px}.metric span{display:block;color:#9aa59d;font-size:9px}.metric b{font-size:24px;color:#83d866}.bar{height:7px;background:#29372e;border-radius:10px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#65c34d}.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #29372e}.pct{color:#83d866;font-weight:950}.notice{font-size:10px;color:#9aa59d;line-height:1.5}.hidden{display:none}.back{color:#83d866;text-decoration:none;font-size:11px}
</style></head><body>
<header class="hero"><a class="back" href="../">‹ Volver a SCOUTER</a><div class="logo">SCOUT<i>ER</i></div><div class="muted">SIMULADOR DE REMATES · MONTE CARLO</div><h2>10.000 escenarios por partido</h2><div class="notice">Modelo ataque/defensa + Poisson o Negative Binomial según la dispersión histórica. Los resultados son probabilidades estadísticas, no garantías.</div></header>
<section class="panel"><div class="teams"><input id="home" class="input" placeholder="Equipo local"><input id="away" class="input" placeholder="Equipo visitante"></div><button class="run" onclick="simulate()">SIMULAR 10.000 VECES</button></section>
<section id="out" class="panel hidden"></section>
<script>
function poisson(mean){let L=Math.exp(-mean),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function simulate(){let h=document.getElementById('home').value||'Local',a=document.getElementById('away').value||'Visitante';/* Valores iniciales solo para la demo visual; la fuente oficial se cargará desde simulaciones_hoy.json cuando el workflow la genere. */let hm=poisson(12),am=poisson(11),hs=Math.min(hm,poisson(4.2)),as=Math.min(am,poisson(3.9));let H=[],A=[],HS=[],AS=[];for(let i=0;i<10000;i++){let x=poisson(12),y=poisson(11);H.push(x);A.push(y);HS.push(Math.min(x,poisson(4.2)));AS.push(Math.min(y,poisson(3.9)))}let avg=x=>x.reduce((s,v)=>s+v,0)/x.length,p=(arr,n)=>arr.filter(v=>v>n).length/100;let th=HS.map((v,i)=>v+AS[i]);document.getElementById('out').classList.remove('hidden');document.getElementById('out').innerHTML=`<h3>${h} vs ${a}</h3><div class="mc"><div class="metric"><span>REMATES ${h}</span><b>${avg(H).toFixed(1)}</b></div><div class="metric"><span>REMATES ${a}</span><b>${avg(A).toFixed(1)}</b></div><div class="metric"><span>AL ARCO ${h}</span><b>${avg(HS).toFixed(1)}</b></div><div class="metric"><span>AL ARCO ${a}</span><b>${avg(AS).toFixed(1)}</b></div></div><h4>PROBABILIDADES</h4><div class="line"><span>Remates totales +20.5</span><b class="pct">${p(H.map((v,i)=>v+A[i]),20.5).toFixed(1)}%</b></div><div class="line"><span>Remates al arco +5.5</span><b class="pct">${p(th,5.5).toFixed(1)}%</b></div><div class="line"><span>${h} +10.5 remates</span><b class="pct">${p(H,10.5).toFixed(1)}%</b></div><div class="line"><span>${a} +10.5 remates</span><b class="pct">${p(A,10.5).toFixed(1)}%</b></div><div class="line"><span>${h} +2.5 al arco</span><b class="pct">${p(HS,2.5).toFixed(1)}%</b></div><div class="line"><span>${a} +2.5 al arco</span><b class="pct">${p(AS,2.5).toFixed(1)}%</b></div><p class="notice">La pantalla de simulación quedará conectada al histórico oficial generado por GitHub Actions. La ejecución local de arriba sirve como prueba visual del motor Monte Carlo.</p>`}
</script></body></html>
