<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101814">
<title>SCOUTER · Fútbol</title>
<style>
:root{--bg:#101814;--s:#17201b;--s2:#1d2821;--line:#2a352d;--g:#66c34d;--t:#f1f5ef;--m:#89948c;--soft:#b8c0ba;--gold:#f5c744}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{max-width:760px;margin:auto;padding-bottom:84px}.head{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#2c4b29,#17231b);padding:18px 16px 12px;border-radius:0 0 24px 24px}.brand{display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:900;font-style:italic}.logo em{font-style:normal;color:var(--g)}.actions{display:flex;gap:7px}.pill{border:1px solid #fff2;background:#fff2;border-radius:22px;padding:9px 12px;font-weight:800;color:white}.vip{background:var(--gold);color:#111;border:0}.search{width:100%;margin-top:14px;background:#0d140f;border:1px solid #fff1;border-radius:12px;padding:12px;color:white;outline:0}.tabs{display:flex;gap:25px;overflow:auto;padding:13px 14px 4px;scrollbar-width:none}.tabs button{white-space:nowrap;background:none;border:0;color:var(--m);font-weight:800;padding:5px 0 10px}.tabs button.on{color:white;border-bottom:3px solid var(--g)}main{padding:8px 12px}.title{display:flex;justify-content:space-between;align-items:end;margin:8px 3px 13px}.title small{color:var(--m);font-size:9px;letter-spacing:1.5px}.title h1{font-size:22px;margin:3px 0}.updated{color:var(--m);font-size:9px}.top,.league{background:#121b16;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}.sec-head{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.sec-head b{font-size:15px}.kicker{display:block;color:var(--g);font-size:9px;letter-spacing:1.8px;font-weight:900}.pick{display:grid;grid-template-columns:32px 1fr 45px;gap:8px;padding:12px;border-bottom:1px solid var(--line);text-align:left;background:none;color:white;width:100%}.pick:last-child{border:0}.rank{color:var(--g);font-weight:900}.pick small{display:block;color:var(--m);font-size:9px}.pick strong{display:block;font-size:12px;margin:3px 0}.pick span{color:var(--soft);font-size:10px}.prob{color:var(--g);font-weight:900;text-align:right}.league-title{padding:14px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.league-title b{font-size:15px}.league-title span{font-size:10px;color:var(--m)}.games{padding:10px}.game{background:linear-gradient(180deg,#1c2920,#162019);border:1px solid #26342b;border-radius:13px;margin-bottom:10px;overflow:hidden}.game-head{width:100%;padding:14px 12px 11px;display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:7px;background:none;color:white;text-align:center}.team{font-size:13px;font-weight:800}.away{text-align:right}.home{text-align:left}.time small{display:block;color:var(--m);font-size:8px}.time b{font-size:11px}.pickline{display:flex;justify-content:space-between;padding:9px 12px;background:#0f1712;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:10px}.pickline span{color:var(--g);font-weight:800}.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px 12px}.odd{background:#111913;border:1px solid #263229;border-radius:8px;text-align:center;padding:7px}.odd span{display:block;color:var(--m);font-size:8px}.odd b{font-size:13px}.star{float:right;background:none;border:0;color:#d7ded8;font-size:22px}.star.on{color:var(--gold)}.detail{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto}.detail.open{display:block}.dhead{position:sticky;top:0;z-index:3;background:#121b16;padding:14px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border-bottom:1px solid var(--line)}.back{font-size:34px;color:var(--g);background:none;border:0}.score{text-align:center}.score small{display:block;color:var(--m);font-size:9px}.score b{font-size:15px}.dtabs{position:sticky;top:68px;z-index:3;display:flex;overflow:auto;background:#151e19;border-bottom:1px solid var(--line)}.dtabs button{background:none;border:0;color:var(--m);padding:13px 14px;font-size:10px;font-weight:800;white-space:nowrap}.dtabs button.on{color:white;border-bottom:3px solid var(--g)}.panel{padding:15px}.hero{background:linear-gradient(135deg,#1d3320,#17241b);border:1px solid #4f8e4266;border-radius:15px;padding:17px}.hero small{color:var(--g);font-weight:900;letter-spacing:1.5px}.hero h2{font-size:18px;margin:7px 0}.hero p{font-size:11px;color:var(--soft);line-height:1.5}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}.metric{background:#0d1510aa;border-radius:9px;padding:10px}.metric b{display:block;color:var(--g);font-size:17px}.metric span{font-size:8px;color:var(--m)}h3{font-size:10px;color:var(--m);letter-spacing:1.5px;margin:20px 2px 9px;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{background:#0e1611;border:1px solid var(--line);border-radius:9px;padding:10px}.stat span{display:block;color:var(--m);font-size:8px}.stat b{font-size:14px}.event{display:grid;grid-template-columns:35px 65px 1fr;gap:7px;padding:9px 0;border-bottom:1px solid var(--line);font-size:10px}.event b{color:var(--g)}.event span{color:var(--m)}.empty{padding:13px;border:1px dashed #344039;border-radius:9px;color:var(--m);font-size:10px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:74px;background:#151d18f7;backdrop-filter:blur(14px);border-top:1px solid #2a342d;display:grid;grid-template-columns:repeat(5,1fr);z-index:40}.bottom button{border:0;background:none;color:var(--m);font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.bottom button.on{color:white}.bottom i{font-style:normal;font-size:21px}.bottom .on i{color:var(--g)}
</style></head><body>
<div class="head"><div class="brand"><div class="logo">SCOUT<em>ER</em></div><div class="actions"><button class="pill">◌</button><button class="pill">$</button><button class="pill vip">♛ VIP</button></div></div><input id="search" class="search" placeholder="Buscar equipo o partido..."></div>
<nav class="tabs"><button class="on" data-filter="all">Ganador</button><button data-filter="goals">Más/Menos 2.5</button><button data-filter="first">Ganador 1er Tiempo</button><button data-filter="btts">Ambos Anotan</button><button data-filter="smart">Apuesta inteligente</button></nav>
<main id="app"><div class="title"><div><small>SCOUTING · FÚTBOL</small><h1>Picks de hoy</h1></div><span id="updated" class="updated">Cargando...</span></div><div id="top" class="top"></div><div id="leagues"></div></main>
<div id="detail" class="detail"></div>
<nav class="bottom"><button class="on" data-nav="leagues"><i>⚽</i>Ligas</button><button data-nav="top"><i>♨</i>Consejos VIP</button><button data-nav="teams"><i>♙</i>Equipos</button><button data-nav="live"><i>▣</i>En vivo</button><button data-nav="fav"><i>☆</i>Favoritos</button></nav>
<script>
const $=(s,c=document)=>c.querySelector(s), $$=(s,c=document)=>[...c.querySelectorAll(s)];let DATA=null,current='all',favs=JSON.parse(localStorage.getItem('scouter_favs')||'[]');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function team(p,k){return typeof p[k]==='object'?(p[k]?.nombre||p[k]?.name||'Equipo'):String(p[k]||'Equipo')}
function odds(p){let o=p.cuotas?.[0];if(!o)return '';let h=o.homeTeamOdds?.moneyLine,a=o.awayTeamOdds?.moneyLine,u=o.overUnder;return '<div class="odds">'+(h!=null?`<div class="odd"><span>Local</span><b>${esc(h)}</b></div>`:'')+(a!=null?`<div class="odd"><span>Visitante</span><b>${esc(a)}</b></div>`:'')+(u!=null?`<div class="odd"><span>O/U</span><b>${esc(u)}</b></div>`:'')+'</div>'}
function pick(p){let x=p.pick_mas_seguro||{};return {market:x.mercado||'Apuesta inteligente',prob:x.probabilidad,conf:x.confianza,why:x.justificacion||'No hay justificación disponible.'}}
function badge(x){let s=x.market.toLowerCase();if(s.includes('visitante')&&s.includes('empate'))return '🏆 Ganador Visitante o Empate';if(s.includes('local')&&s.includes('empate'))return '🏆 Ganador Local o Empate';if(s.includes('menos'))return '✓ Menos';if(s.includes('más'))return '✓ Más';if(s.includes('ambos'))return '✓ Ambos Anotan';return '✓ '+x.market}
function history(h){if(!h||!h.partidos_evaluados)return '<div class="empty">Sin historial calculable.</div>';return `<div class="grid"><div class="stat"><span>GF promedio</span><b>${esc(h.goles_favor_prom)}</b></div><div class="stat"><span>GC promedio</span><b>${esc(h.goles_contra_prom)}</b></div><div class="stat"><span>Remates</span><b>${esc(h.remates_totales_prom)}</b></div><div class="stat"><span>Al arco</span><b>${esc(h.remates_arco_prom)}</b></div><div class="stat"><span>Ambos anotan</span><b>${esc(h.partidos_ambos_anotan_pct)}%</b></div><div class="stat"><span>Tarjetas</span><b>${esc(h.tarjetas_prom)}</b></div></div>`}
function events(p){let e=p.eventos_clave||[];return e.length?e.slice(0,15).map(x=>`<div class="event"><b>${esc(x.clock?.displayValue||'')}</b><span>${esc(x.type?.text||'')}</span><span>${esc(x.text||'')}</span></div>`).join(''):'<div class="empty">No hay eventos disponibles.</div>'}
function renderTop(){let arr=DATA.top5_dia||[];$('#top').innerHTML='<div class="sec-head"><div><span class="kicker">SELECCIÓN</span><b>Consejos destacados</b></div><span class="kicker">TOP 5</span></div>'+(arr.slice(0,5).map((p,i)=>`<button class="pick" onclick="openByTeams(${JSON.stringify(p.local)},${JSON.stringify(p.visita)})"><span class="rank">#${i+1}</span><div><small>${esc(p.liga_nombre)}</small><strong>${esc(p.local)} vs. ${esc(p.visita)}</strong><span>${esc(p.mercado)}</span></div><span class="prob">${esc(p.probabilidad??'—')}%</span></button>`).join('')||'<div class="empty">No hay picks destacados.</div>')}
function render(){let html='';DATA.ligas.forEach(l=>{let games=l.partidos||[];if(!games.length)return;html+=`<section class="league"><div class="league-title"><b>${esc(l.nombre)}</b><span>${games.length} partidos</span></div><div class="games">${games.map((p,i)=>{p.__id=l.slug+'-'+i;let x=pick(p);return `<article class="game" data-id="${esc(p.__id)}" data-text="${esc((team(p,'local')+' '+team(p,'visita')+' '+x.market).toLowerCase())}"><button class="game-head" onclick="openMatch('${esc(p.__id)}')"><span class="team home">${esc(team(p,'local'))}</span><span class="time"><small>${esc(p.estado||'Programado')}</small><b>${esc(p.hora||'')}</b></span><span class="team away">${esc(team(p,'visita'))}</span></button><div class="pickline"><span>${esc(badge(x))}</span><b>${esc(x.prob??'—')}%</b></div>${odds(p)}<button class="star ${favs.includes(p.__id)?'on':''}" onclick="toggleFav(event,'${esc(p.__id)}')">${favs.includes(p.__id)?'★':'☆'}</button></article>`}).join('')}</div></section>`});$('#leagues').innerHTML=html}
function find(id){for(const l of DATA.ligas)for(const p of l.partidos||[]){if(p.__id===id)return p}return null}
function openMatch(id){let p=find(id);if(!p)return;let x=pick(p),l=team(p,'local'),a=team(p,'visita');$('#detail').innerHTML=`<div class="dhead"><button class="back" onclick="closeDetail()">‹</button><div class="score"><small>${esc(p.estado||'Programado')}</small><b>${esc(l)} <span>vs</span> ${esc(a)}</b><small>${esc(p.hora||'')}</small></div><button class="star ${favs.includes(id)?'on':''}" onclick="toggleFav(event,'${esc(id)}')">${favs.includes(id)?'★':'☆'}</button></div><div class="dtabs"><button class="on" onclick="tab(this,'summary')">RESUMEN</button><button onclick="tab(this,'pred')">PREDICCIONES</button><button onclick="tab(this,'odds')">CUOTAS</button><button onclick="tab(this,'stats')">ESTADÍSTICAS</button></div><section class="panel" id="summary"><div class="hero"><small>PICK MÁS SEGURO</small><h2>${esc(x.market)}</h2><p>${esc(x.why)}</p><div class="metrics"><div class="metric"><b>${esc(x.prob??'—')}%</b><span>Probabilidad</span></div><div class="metric"><b>${esc(x.conf||'—')}</b><span>Confianza</span></div></div></div><h3>${esc(l)}</h3>${history(p.historial_local)}<h3>${esc(a)}</h3>${history(p.historial_visita)}<h3>Eventos clave</h3>${events(p)}</section><section class="panel" id="pred" style="display:none"><div class="hero"><small>RECOMENDACIÓN</small><h2>${esc(x.market)}</h2><p>${esc(x.why)}</p></div></section><section class="panel" id="odds" style="display:none">${odds(p)||'<div class="empty">Cuotas no disponibles.</div>'}</section><section class="panel" id="stats" style="display:none"><div class="empty">Las estadísticas avanzadas solo se muestran cuando están presentes en la fuente de datos.</div><h3>H2H</h3>${p.h2h?.length?`<div class="empty">${esc(p.h2h[0]?.summary||'Historial H2H disponible')}</div>`:'<div class="empty">H2H no disponible.</div>'}</section>`;$('#detail').classList.add('open');document.body.style.overflow='hidden'}
function openByTeams(l,a){for(const x of DATA.ligas)for(const p of x.partidos||[])if(team(p,'local')===l&&team(p,'visita')===a){openMatch(p.__id);return}}
function closeDetail(){$('#detail').classList.remove('open');document.body.style.overflow=''}function tab(b,id){$$('.dtabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$$('.panel',$('#detail')).forEach(x=>x.style.display=x.id===id?'block':'none')}
function toggleFav(e,id){e?.stopPropagation();let i=favs.indexOf(id);if(i>=0)favs.splice(i,1);else favs.push(id);localStorage.setItem('scouter_favs',JSON.stringify(favs));render();if($('#detail').classList.contains('open'))openMatch(id)}
function filter(mode){current=mode;let q=$('#search').value.toLowerCase();$$('.game').forEach(g=>{let t=g.dataset.text||'',ok=t.includes(q);if(mode==='goals')ok&&=(t.includes('más')||t.includes('menos')||t.includes('goles'));if(mode==='first')ok&&=t.includes('primer');if(mode==='btts')ok&&=t.includes('ambos');if(mode==='smart')ok&&=!t.includes('ganador');g.style.display=ok?'':'none'});$$('.league').forEach(s=>s.style.display=$$('.game',s).some(g=>g.style.display!=='none')?'':'none')}
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter(b.dataset.filter)});$('#search').oninput=()=>filter(current);$$('.bottom button').forEach((b,i)=>b.onclick=()=>{$$('.bottom button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(i===0){filter('all');scrollTo(0,0)}if(i===1)$('#top').scrollIntoView({behavior:'smooth'});if(i===2)alert('Equipos: conectaremos esta sección a la base de equipos.');if(i===3){$$('.game').forEach(g=>g.style.display=g.innerText.toLowerCase().includes('en vivo')?'':'none')}if(i===4){$$('.game').forEach(g=>g.style.display=favs.includes(g.dataset.id)?'':'none')}});
fetch('datos/picks_hoy.json?'+Date.now()).then(r=>r.json()).then(d=>{DATA=d;$('#updated').textContent=d.generado?new Date(d.generado).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';renderTop();render()}).catch(e=>{$('#leagues').innerHTML='<div class="empty">No se pudieron cargar los datos de hoy.</div>';console.error(e)})
</script></body></html>
