<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101712"><title>SCOUTER · Predicciones</title><style>
:root{--bg:#101712;--card:#18211b;--card2:#111914;--line:#29352d;--g:#65c34d;--g2:#83d866;--muted:#8b968e;--txt:#f2f6f2;--gold:#f4c53e}*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif;max-width:760px;padding-bottom:82px}.header{background:linear-gradient(155deg,#2d512a,#17241b);padding:17px 15px 13px;border-radius:0 0 25px 25px;position:sticky;top:0;z-index:30}.brand{display:flex;justify-content:space-between;align-items:center}.logo{font-size:29px;font-weight:950;font-style:italic}.logo i{color:var(--g2);font-style:normal}.actions{display:flex;gap:6px}.circle,.vip{border:1px solid #ffffff22;background:#ffffff16;color:#fff;border-radius:20px;padding:8px 11px;font-weight:850}.vip{background:var(--gold);color:#111;border:0;padding:9px 14px}.search{width:100%;margin-top:12px;padding:11px 13px;border:1px solid #ffffff18;border-radius:11px;background:#0d140f;color:#fff;outline:0}.tabs{display:flex;gap:24px;overflow:auto;padding:12px 14px 3px;background:#141d18}.tabs button{white-space:nowrap;border:0;background:none;color:var(--muted);font-weight:850;padding:0 0 10px}.tabs .on{color:#fff;border-bottom:3px solid var(--g)}main{padding:12px}.heading{display:flex;justify-content:space-between;align-items:end;margin:5px 3px 13px}.heading small,.kicker{color:var(--muted);font-size:8px;letter-spacing:1.6px}.heading h1{font-size:23px;margin:4px 0}.section{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;margin-bottom:13px}.sectionHead,.leagueHead{padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.sectionHead b,.leagueHead b{font-size:15px}.topRow{display:grid;grid-template-columns:28px 1fr 58px;gap:8px;width:100%;padding:12px;border:0;border-bottom:1px solid var(--line);background:none;color:#fff;text-align:left}.rank{color:var(--g);font-weight:950}.topRow small{display:block;color:var(--muted);font-size:8px}.topRow strong{display:block;font-size:12px;margin:3px 0}.percent{color:var(--g2);font-weight:950;text-align:right}.leagueHead span{color:var(--muted);font-size:8px}.games{padding:9px}.game{background:linear-gradient(145deg,#1c2820,#162019);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden}.gameHead{display:grid;grid-template-columns:1fr 75px 1fr;width:100%;padding:14px 11px 10px;border:0;background:none;color:#fff;text-align:center}.team{font-size:13px;font-weight:900}.left{text-align:left}.right{text-align:right}.time{font-size:8px;color:var(--muted)}.time b{display:block;color:#fff;font-size:10px;margin-top:4px}.pickStrip{display:flex;justify-content:space-between;gap:8px;padding:9px 11px;background:#0e1711;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:10px}.pickStrip span{color:var(--g2);font-weight:900}.pickStrip b{color:var(--g2)}.miniBar{height:4px;background:#29352d}.miniBar i{display:block;height:100%;background:var(--g)}.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px 10px}.odd{background:#101812;border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center}.odd small{display:block;color:var(--muted);font-size:8px}.odd b{font-size:13px}.star{float:right;background:none;border:0;color:#dce3dc;font-size:22px}.star.on{color:var(--gold)}.empty{padding:14px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:10px}.detail{display:none;position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto}.detail.open{display:block}.dhead{position:sticky;top:0;z-index:5;background:#121b16;padding:12px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border-bottom:1px solid var(--line)}.back{background:none;border:0;color:var(--g);font-size:35px}.score{text-align:center}.score small{display:block;color:var(--muted);font-size:8px}.score b{font-size:14px}.dtabs{position:sticky;top:65px;z-index:5;display:flex;overflow:auto;background:#151e19;border-bottom:1px solid var(--line)}.dtabs button{border:0;background:none;color:var(--muted);font-size:9px;font-weight:900;padding:13px 14px;white-space:nowrap}.dtabs button.on{color:#fff;border-bottom:3px solid var(--g)}.panel{padding:14px}.result{background:linear-gradient(145deg,#20351f,#18251c);border:1px solid #4f914233;border-radius:15px;padding:15px}.result .tag{color:var(--g2);font-size:8px;font-weight:950;letter-spacing:1.6px}.result h2{font-size:18px;margin:7px 0 5px}.result p{color:#bdc7bf;font-size:10px;line-height:1.5;margin:0}.big{display:flex;align-items:end;gap:6px;margin-top:12px}.big b{font-size:30px;color:var(--g2)}.big span{color:var(--muted);font-size:9px;padding-bottom:5px}.confidence{display:inline-block;margin-top:7px;background:#65c34d20;color:var(--g2);border-radius:20px;padding:5px 9px;font-size:8px;font-weight:900}.bars{margin-top:13px}.rbar{display:grid;grid-template-columns:90px 1fr 42px;gap:7px;align-items:center;margin:9px 0;font-size:8px}.bar{height:6px;background:#2b362f;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:10px}.rbar b{text-align:right;font-size:9px}.title2{font-size:9px;color:var(--muted);letter-spacing:1.6px;font-weight:950;margin:20px 2px 9px}.rec{background:#161f19;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}.rec.best{border-color:#5a9d4b;background:linear-gradient(120deg,#1b2b1d,#151e19)}.recTop{display:flex;justify-content:space-between;gap:10px}.recTitle{font-size:11px;font-weight:900}.recPct{color:var(--g2);font-weight:950}.rec small{display:block;color:var(--muted);font-size:8px;line-height:1.45;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:10px}.stat span{display:block;color:var(--muted);font-size:8px}.stat b{font-size:16px}.analysis{background:#151e19;border:1px solid var(--line);border-radius:12px;padding:12px;color:#c0c9c2;font-size:10px;line-height:1.6;white-space:pre-line}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:73px;background:#151d18f7;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:40}.bottom button{border:0;background:none;color:var(--muted);font-size:9px}.bottom button.on{color:#fff}.bottom i{display:block;font-style:normal;font-size:21px;margin-bottom:3px}.bottom .on i{color:var(--g)}
</style></head><body>
<header class="header"><div class="brand"><div class="logo">SCOUT<i>ER</i></div><div class="actions"><button class="circle">◌</button><button class="circle">$</button><button class="vip">♛ VIP</button></div></div><input id="search" class="search" placeholder="Buscar equipo o partido..."></header>
<nav class="tabs"><button class="on" data-filter="all">Ganador</button><button data-filter="goles">Más/Menos 2.5</button><button data-filter="btts">Ambos Anotan</button><button data-filter="remates">Remates</button><button data-filter="tarjetas">Tarjetas</button></nav>
<main><div class="heading"><div><small>SCOUTING · ANÁLISIS ESTADÍSTICO</small><h1>Partidos de hoy</h1></div><small id="updated">Cargando...</small></div><section id="top" class="section"></section><div id="leagues"></div></main>
<div id="detail" class="detail"></div><nav class="bottom"><button class="on" onclick="showAll()"><i>⚽</i>Ligas</button><button onclick="scrollTopPicks()"><i>♨</i>Consejos VIP</button><button onclick="alert('Buscador de equipos: próximamente')"><i>♙</i>Equipos</button><button onclick="showLive()"><i>▣</i>En vivo</button><button onclick="showFav()"><i>☆</i>Favoritos</button></nav>
<script>
const $=(s,c=document)=>c.querySelector(s),$$=(s,c=document)=>[...c.querySelectorAll(s)];let D=null,favs=JSON.parse(localStorage.getItem('scouter_favs')||'[]'),active='all';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function team(p,k){return typeof p[k]==='object'?(p[k]?.nombre||p[k]?.displayName||'Equipo'):p[k]||'Equipo'}function recs(p){return Array.isArray(p.recomendaciones)?p.recomendaciones:[]}function first(p){return recs(p)[0]||{}}function odds(p){let o=p.cuotas?.[0];if(!o)return '';let h=o.homeTeamOdds?.moneyLine,a=o.awayTeamOdds?.moneyLine,u=o.overUnder;return `<div class="odds">${h!=null?`<div class="odd"><small>Local</small><b>${esc(h)}</b></div>`:''}${u!=null?`<div class="odd"><small>Total</small><b>${esc(u)}</b></div>`:''}${a!=null?`<div class="odd"><small>Visitante</small><b>${esc(a)}</b></div>`:''}</div>`}
function renderTop(){let a=D.top5_dia||[];$('#top').innerHTML=`<div class="sectionHead"><div><span class="kicker">SELECCIÓN DEL MODELO</span><b>Consejos más fuertes</b></div><span class="kicker">TOP ${Math.min(5,a.length)}</span></div>`+(a.length?a.map((p,i)=>`<button class="topRow" onclick="openByTeams('${esc(p.local)}','${esc(p.visita)}')"><span class="rank">#${i+1}</span><div><small>${esc(p.liga_nombre)}</small><strong>${esc(p.local)} vs. ${esc(p.visita)}</strong><span>${esc(p.mercado)}</span></div><span class="percent">${esc(p.probabilidad)}%</span></button>`).join(''):'<div class="empty">No hay picks suficientes todavía.</div>')}
function render(){let html='';D.ligas.forEach(l=>{let ps=l.partidos||[];if(!ps.length)return;html+=`<section class="section league"><div class="leagueHead"><b>${esc(l.nombre)}</b><span>${ps.length} con predicción</span></div><div class="games">${ps.map((p,i)=>{p.__id=l.slug+'-'+i;let r=first(p);return `<article class="game" data-id="${p.__id}" data-text="${esc((team(p,'local')+' '+team(p,'visita')+' '+recs(p).map(x=>x.mercado).join(' ')).toLowerCase())}"><button class="gameHead" onclick="openMatch('${p.__id}')"><span class="team left">${esc(team(p,'local'))}</span><span class="time">${esc(p.estado||'Programado')}<b>${esc(p.hora||'')}</b></span><span class="team right">${esc(team(p,'visita'))}</span></button><div class="pickStrip"><span>✓ ${esc(r.mercado)}</span><b>${esc(r.probabilidad)}%</b></div><div class="miniBar"><i style="width:${Math.min(Number(r.probabilidad)||0,100)}%"></i></div>${odds(p)}<button class="star ${favs.includes(p.__id)?'on':''}" onclick="fav(event,'${p.__id}')">${favs.includes(p.__id)?'★':'☆'}</button></article>`}).join('')}</div></section>`});$('#leagues').innerHTML=html;applyFilter()}
function find(id){for(let l of D.ligas)for(let p of l.partidos||[])if(p.__id===id)return p}function openByTeams(a,b){for(let l of D.ligas)for(let p of l.partidos||[])if(team(p,'local')===a&&team(p,'visita')===b)openMatch(p.__id)}
function openMatch(id){let p=find(id);if(!p)return;let l=team(p,'local'),a=team(p,'visita'),rs=recs(p),r=first(p);$('#detail').innerHTML=`<div class="dhead"><button class="back" onclick="closeDetail()">‹</button><div class="score"><small>${esc(p.estado||'Programado')}</small><b>${esc(l)} · ${esc(a)}</b><small>${esc(p.hora||'')}</small></div><button class="star ${favs.includes(id)?'on':''}" onclick="fav(event,'${id}')">${favs.includes(id)?'★':'☆'}</button></div><div class="dtabs"><button class="on" onclick="tab(this,'pred')">PREDICCIONES</button><button onclick="tab(this,'sum')">RESUMEN</button><button onclick="tab(this,'stats')">ESTADÍSTICAS</button><button onclick="tab(this,'oddsP')">CUOTAS</button></div><section id="pred" class="panel"><div class="result"><span class="tag">PICK MÁS SEGURO</span><h2>${esc(r.mercado)}</h2><p>${esc(r.justificacion)}</p><div class="big"><b>${esc(r.probabilidad)}%</b><span>probabilidad estimada</span></div><span class="confidence">✓ Confianza ${esc(r.confianza)}</span><div class="bars">${rs.slice(0,3).map(x=>`<div class="rbar"><span>${esc(x.mercado)}</span><div class="bar"><i style="width:${Math.min(Number(x.probabilidad)||0,100)}%"></i></div><b>${esc(x.probabilidad)}%</b></div>`).join('')}</div></div><div class="title2">TODAS LAS RECOMENDACIONES</div>${rs.map((x,i)=>`<div class="rec ${i===0?'best':''}"><div class="recTop"><span class="recTitle">${i===0?'✓ ':''}${esc(x.mercado)}</span><span class="recPct">${esc(x.probabilidad)}%</span></div><div class="bar"><i style="width:${Math.min(Number(x.probabilidad)||0,100)}%"></i></div><small>${esc(x.confianza)} · ${esc(x.justificacion)}</small></div>`).join('')}</section><section id="sum" class="panel" style="display:none"><div class="title2">LECTURA DEL PARTIDO</div><div class="analysis">${esc(p.analisis||'Sin análisis.')}</div></section><section id="stats" class="panel" style="display:none"><div class="title2">${esc(l)}</div>${hist(p.historial_local)}<div class="title2">${esc(a)}</div>${hist(p.historial_visita)}</section><section id="oddsP" class="panel" style="display:none">${odds(p)||'<div class="empty">Cuotas no disponibles.</div>'}</section>`;$('#detail').classList.add('open');document.body.style.overflow='hidden'}
function hist(h){if(!h||!h.partidos_evaluados)return '<div class="empty">Sin historial.</div>';return `<div class="grid"><div class="stat"><span>Partidos</span><b>${esc(h.partidos_evaluados)}</b></div><div class="stat"><span>GF / partido</span><b>${esc(h.goles_favor_prom)}</b></div><div class="stat"><span>GC / partido</span><b>${esc(h.goles_contra_prom)}</b></div><div class="stat"><span>Remates</span><b>${esc(h.remates_totales_prom)}</b></div><div class="stat"><span>Al arco</span><b>${esc(h.remates_arco_prom)}</b></div><div class="stat"><span>BTTS</span><b>${esc(h.partidos_ambos_anotan_pct)}%</b></div><div class="stat"><span>Tarjetas</span><b>${esc(h.tarjetas_prom)}</b></div></div>`}function tab(b,id){$$('.dtabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['pred','sum','stats','oddsP'].forEach(x=>$('#'+x).style.display=x===id?'block':'none')}function closeDetail(){$('#detail').classList.remove('open');document.body.style.overflow=''}function fav(e,id){e.stopPropagation();let i=favs.indexOf(id);if(i>=0)favs.splice(i,1);else favs.push(id);localStorage.setItem('scouter_favs',JSON.stringify(favs));render()}
function applyFilter(){let q=($('#search').value||'').toLowerCase();$$('.game').forEach(g=>{let t=g.dataset.text||'',ok=t.includes(q);if(active==='goles')ok=ok&&t.includes('goles');if(active==='btts')ok=ok&&t.includes('anotan');if(active==='remates')ok=ok&&t.includes('remates');if(active==='tarjetas')ok=ok&&t.includes('tarjetas');g.style.display=ok?'':'none'});$$('.league').forEach(s=>s.style.display=$$('.game',s).some(x=>x.style.display!=='none')?'':'none')}
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');active=b.dataset.filter;applyFilter()});$('#search').oninput=applyFilter;function showAll(){active='all';$$('.tabs button').forEach((x,i)=>x.classList.toggle('on',i===0));applyFilter();scrollTo(0,0)}function showFav(){$$('.game').forEach(g=>g.style.display=favs.includes(g.dataset.id)?'':'none')}function showLive(){$$('.game').forEach(g=>g.style.display=/en vivo|live/i.test(g.innerText)?'':'none')}function scrollTopPicks(){$('#top').scrollIntoView({behavior:'smooth'})}
fetch('datos/picks_hoy.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;$('#updated').textContent=d.generado?new Date(d.generado).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';renderTop();render()}).catch(()=>{$('#leagues').innerHTML='<div class="empty">No se pudieron cargar los datos.</div>'});</script></body></html>
