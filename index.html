<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101814"><title>SCOUTER · Fútbol</title>
<style>
:root{--bg:#101814;--card:#17201b;--card2:#1c2820;--line:#2b372f;--green:#69c94e;--muted:#8c978f;--text:#f2f5f2;--gold:#f3c640}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;max-width:760px;margin:auto;padding-bottom:82px}.header{background:linear-gradient(#2c4a2b,#17221b);padding:18px 15px 13px;border-radius:0 0 23px 23px;position:sticky;top:0;z-index:10}.brand{display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:900;font-style:italic}.logo i{color:var(--green);font-style:normal}.vip{background:var(--gold);border:0;border-radius:20px;padding:9px 14px;font-weight:900}.search{margin-top:12px;width:100%;padding:11px;border-radius:11px;border:1px solid #ffffff18;background:#0d140f;color:white}.tabs{display:flex;gap:23px;overflow:auto;padding:12px 14px 5px;background:#141d18}.tabs button{white-space:nowrap;background:none;border:0;color:var(--muted);font-weight:800;padding-bottom:9px}.tabs .on{color:white;border-bottom:3px solid var(--green)}main{padding:12px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.heading small,.kicker{color:var(--muted);font-size:9px;letter-spacing:1.5px}.heading h1{margin:3px 0;font-size:23px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}.sectionHead{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.sectionHead b{font-size:15px}.topPick{display:grid;grid-template-columns:28px 1fr 48px;padding:12px;border:0;border-bottom:1px solid var(--line);background:none;color:white;width:100%;text-align:left}.topPick:last-child{border:0}.rank{color:var(--green);font-weight:900}.topPick small{display:block;color:var(--muted);font-size:9px}.topPick strong{display:block;margin:3px 0}.pct{color:var(--green);font-weight:900;text-align:right}.leagueTitle{padding:13px 14px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.games{padding:9px}.game{background:linear-gradient(#1d2921,#162019);border:1px solid #2b392f;border-radius:13px;margin-bottom:10px;overflow:hidden}.gameHead{display:grid;grid-template-columns:1fr 65px 1fr;width:100%;border:0;background:none;color:white;padding:14px 10px 10px;text-align:center}.team{font-weight:850;font-size:13px}.left{text-align:left}.right{text-align:right}.time{font-size:10px;color:var(--muted)}.time b{display:block;color:white;margin-top:3px}.mainPick{display:flex;justify-content:space-between;gap:8px;padding:9px 11px;background:#0e1711;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:10px}.mainPick b{color:var(--green)}.odds{display:flex;gap:7px;padding:8px 10px}.odd{flex:1;background:#101812;border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center}.odd small{display:block;color:var(--muted);font-size:8px}.star{float:right;background:none;border:0;color:#dce3dc;font-size:22px}.star.on{color:var(--gold)}.empty{padding:14px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:11px}.detail{display:none;position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto}.detail.open{display:block}.dhead{position:sticky;top:0;background:#121b16;padding:13px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border-bottom:1px solid var(--line);z-index:4}.back{background:none;border:0;color:var(--green);font-size:34px}.score{text-align:center}.score small{display:block;color:var(--muted);font-size:9px}.score b{font-size:14px}.dtabs{position:sticky;top:67px;background:#151e19;display:flex;overflow:auto;border-bottom:1px solid var(--line);z-index:4}.dtabs button{white-space:nowrap;background:none;border:0;color:var(--muted);padding:13px;font-size:10px;font-weight:900}.dtabs .on{color:white;border-bottom:3px solid var(--green)}.panel{padding:14px}.hero{background:linear-gradient(135deg,#203820,#17241b);border:1px solid #4d914133;border-radius:15px;padding:16px}.hero small{color:var(--green);font-weight:900;letter-spacing:1.4px}.hero h2{font-size:18px;margin:7px 0}.hero p{color:#b9c3bc;font-size:11px;line-height:1.5}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{background:#0c140fbb;border-radius:9px;padding:10px}.metric b{display:block;color:var(--green);font-size:19px}.metric span{color:var(--muted);font-size:8px}.recs{margin-top:13px}.rec{background:#151f19;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;padding:11px}.rec.best{border-color:#5a9d4b}.recTop{display:flex;justify-content:space-between;gap:10px}.recTitle{font-weight:850;font-size:12px}.recPct{color:var(--green);font-weight:900}.bar{height:5px;background:#2b352e;border-radius:9px;margin:8px 0}.bar i{display:block;height:100%;background:var(--green);border-radius:9px}.rec small{color:var(--muted);font-size:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{background:#0e1611;border:1px solid var(--line);border-radius:9px;padding:10px}.stat span{display:block;color:var(--muted);font-size:8px}.stat b{font-size:14px}h3{font-size:10px;color:var(--muted);letter-spacing:1.4px;margin:19px 2px 9px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:73px;background:#151d18f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.bottom button{border:0;background:none;color:var(--muted);font-size:9px}.bottom button.on{color:white}.bottom i{display:block;font-style:normal;font-size:21px;margin-bottom:3px}.bottom .on i{color:var(--green)}
</style></head><body>
<header class="header"><div class="brand"><div class="logo">SCOUT<i>ER</i></div><button class="vip">♛ VIP</button></div><input id="search" class="search" placeholder="Buscar equipo o partido..."></header>
<nav class="tabs"><button class="on" data-filter="all">Ganador</button><button data-filter="goles">Más/Menos 2.5</button><button data-filter="btts">Ambos Anotan</button><button data-filter="remates">Remates</button><button data-filter="tarjetas">Tarjetas</button></nav>
<main><div class="heading"><div><small>SCOUTING · FÚTBOL</small><h1>Partidos de hoy</h1></div><small id="updated">Cargando...</small></div><section id="top" class="card"></section><div id="leagues"></div></main>
<div id="detail" class="detail"></div><nav class="bottom"><button class="on" onclick="home()"><i>⚽</i>Ligas</button><button onclick="goTop()"><i>♨</i>Consejos VIP</button><button onclick="alert('Próximamente: buscador avanzado de equipos')"><i>♙</i>Equipos</button><button onclick="filterLive()"><i>▣</i>En vivo</button><button onclick="filterFav()"><i>☆</i>Favoritos</button></nav>
<script>
const $=(s,c=document)=>c.querySelector(s),$$=(s,c=document)=>[...c.querySelectorAll(s)];let D=null,favs=JSON.parse(localStorage.getItem('favs')||'[]'),filter='all';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function team(p,k){return typeof p[k]==='object'?(p[k]?.nombre||p[k]?.name||'Equipo'):p[k]||'Equipo'}
function recs(p){return (p.recomendaciones?.length?p.recomendaciones:p.pick_mas_seguro?.recomendaciones)||[]}
function pick(p){let r=recs(p)[0]||p.pick_mas_seguro||{};return r.mercado||'Sin recomendación disponible'}
function cuotas(p){let o=p.cuotas?.[0];if(!o)return '';let a=o.homeTeamOdds?.moneyLine,b=o.awayTeamOdds?.moneyLine,u=o.overUnder;return `<div class="odds">${a!=null?`<div class="odd"><small>Local</small><b>${esc(a)}</b></div>`:''}${u!=null?`<div class="odd"><small>O/U</small><b>${esc(u)}</b></div>`:''}${b!=null?`<div class="odd"><small>Visitante</small><b>${esc(b)}</b></div>`:''}</div>`}
function renderTop(){let a=D.top5_dia||[];$('#top').innerHTML=`<div class="sectionHead"><div><span class="kicker">SELECCIÓN</span><b>Consejos destacados</b></div><span class="kicker">TOP 5</span></div>${a.length?a.map((p,i)=>`<button class="topPick" onclick="openByTeams('${esc(p.local)}','${esc(p.visita)}')"><span class="rank">#${i+1}</span><div><small>${esc(p.liga_nombre)}</small><strong>${esc(p.local)} vs ${esc(p.visita)}</strong><span>${esc(p.mercado)}</span></div><span class="pct">${esc(p.probabilidad)}%</span></button>`).join(''):'<div class="empty">Todavía no hay picks con suficiente historial.</div>'}`}
function render(){let html='';D.ligas.forEach(l=>{let ps=l.partidos||[];if(!ps.length)return;html+=`<section class="card"><div class="leagueTitle"><b>${esc(l.nombre)}</b><span class="kicker">${ps.length} partidos</span></div><div class="games">${ps.map((p,i)=>{p.__id=l.slug+'-'+i;let rs=recs(p),r=rs[0]||p.pick_mas_seguro||{},txt=(team(p,'local')+' '+team(p,'visita')+' '+rs.map(x=>x.mercado).join(' ')).toLowerCase();return `<article class="game" data-text="${esc(txt)}" data-id="${p.__id}"><button class="gameHead" onclick="openMatch('${p.__id}')"><span class="team left">${esc(team(p,'local'))}</span><span class="time">${esc(p.estado||'Programado')}<b>${esc(p.hora||'')}</b></span><span class="team right">${esc(team(p,'visita'))}</span></button>${r.mercado?`<div class="mainPick"><span>✓ ${esc(r.mercado)}</span><b>${esc(r.probabilidad)}%</b></div>`:'<div class="mainPick"><span>Sin predicción suficiente</span><b>—</b></div>'}${cuotas(p)}<button class="star ${favs.includes(p.__id)?'on':''}" onclick="fav(event,'${p.__id}')">${favs.includes(p.__id)?'★':'☆'}</button></article>`}).join('')}</div></section>`});$('#leagues').innerHTML=html;applyFilter()}
function find(id){for(let l of D.ligas)for(let p of l.partidos||[])if(p.__id===id)return p}
function openByTeams(a,b){for(let l of D.ligas)for(let p of l.partidos||[])if(team(p,'local')===a&&team(p,'visita')===b){openMatch(p.__id);return}}
function openMatch(id){let p=find(id);if(!p)return;let l=team(p,'local'),a=team(p,'visita'),rs=recs(p),r=rs[0]||p.pick_mas_seguro||{};$('#detail').innerHTML=`<div class="dhead"><button class="back" onclick="closeDetail()">‹</button><div class="score"><small>${esc(p.estado||'Programado')}</small><b>${esc(l)} · ${esc(a)}</b><small>${esc(p.hora||'')}</small></div><button class="star ${favs.includes(id)?'on':''}" onclick="fav(event,'${id}')">${favs.includes(id)?'★':'☆'}</button></div><div class="dtabs"><button class="on" onclick="tab(this,'pred')">PREDICCIONES</button><button onclick="tab(this,'sum')">RESUMEN</button><button onclick="tab(this,'stats')">ESTADÍSTICAS</button><button onclick="tab(this,'oddsP')">CUOTAS</button></div><section id="pred" class="panel"><div class="hero"><small>PICK MÁS SEGURO</small><h2>${esc(r.mercado||'Sin predicción')}</h2><p>${esc(r.justificacion||p.pick_mas_seguro?.razon||'No hay muestra estadística suficiente.')}</p><div class="metrics"><div class="metric"><b>${esc(r.probabilidad??'—')}%</b><span>Probabilidad</span></div><div class="metric"><b>${esc(r.confianza||'—')}</b><span>Confianza</span></div></div></div><h3>RECOMENDACIONES</h3><div class="recs">${rs.length?rs.map((x,i)=>`<div class="rec ${i===0?'best':''}"><div class="recTop"><span class="recTitle">${i===0?'✓ ':''}${esc(x.mercado)}</span><span class="recPct">${esc(x.probabilidad)}%</span></div><div class="bar"><i style="width:${Math.min(Number(x.probabilidad)||0,100)}%"></i></div><small>${esc(x.confianza||'')} · ${esc(x.justificacion||'')}</small></div>`).join(''):'<div class="empty">No hay recomendaciones: faltan al menos 5 partidos con datos para ambos equipos.</div>'}</div></section><section id="sum" class="panel" style="display:none"><div class="hero"><small>ANÁLISIS</small><p>${esc(p.analisis||'Sin análisis disponible.')}</p></div></section><section id="stats" class="panel" style="display:none"><h3>${esc(l)}</h3>${hist(p.historial_local)}<h3>${esc(a)}</h3>${hist(p.historial_visita)}</section><section id="oddsP" class="panel" style="display:none">${cuotas(p)||'<div class="empty">Cuotas no disponibles.</div>'}</section>`;$('#detail').classList.add('open');document.body.style.overflow='hidden'}
function hist(h){if(!h||!h.partidos_evaluados)return '<div class="empty">Sin historial real disponible.</div>';return `<div class="grid"><div class="stat"><span>Partidos</span><b>${esc(h.partidos_evaluados)}</b></div><div class="stat"><span>Goles a favor</span><b>${esc(h.goles_favor_prom)}</b></div><div class="stat"><span>Goles contra</span><b>${esc(h.goles_contra_prom)}</b></div><div class="stat"><span>Remates</span><b>${esc(h.remates_totales_prom)}</b></div><div class="stat"><span>Remates al arco</span><b>${esc(h.remates_arco_prom)}</b></div><div class="stat"><span>Ambos anotan</span><b>${esc(h.partidos_ambos_anotan_pct)}%</b></div></div>`}
function tab(b,id){$$('.dtabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['pred','sum','stats','oddsP'].forEach(x=>$('#'+x).style.display=x===id?'block':'none')}
function closeDetail(){$('#detail').classList.remove('open');document.body.style.overflow=''}
function fav(e,id){e.stopPropagation();let i=favs.indexOf(id);if(i>=0)favs.splice(i,1);else favs.push(id);localStorage.setItem('favs',JSON.stringify(favs));render()}
function applyFilter(){let q=$('#search').value.toLowerCase();$$('.game').forEach(g=>{let t=g.dataset.text,ok=t.includes(q);if(filter!=='all')ok=ok&&t.includes(filter);g.style.display=ok?'':'none'});$$('.card').forEach(c=>{if(c.querySelector('.game'))c.style.display=$$('.game',c).some(x=>x.style.display!=='none')?'':'none'})}
function filterLive(){filter='en vivo';applyFilter()}function filterFav(){$$('.game').forEach(g=>g.style.display=favs.includes(g.dataset.id)?'':'none')}function goTop(){$('#top').scrollIntoView({behavior:'smooth'})}function home(){filter='all';applyFilter();scrollTo(0,0)}
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;applyFilter()});$('#search').oninput=applyFilter;
fetch('datos/picks_hoy.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;$('#updated').textContent=d.generado?new Date(d.generado).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';renderTop();render()}).catch(()=>{$('#leagues').innerHTML='<div class="empty">No se pudieron cargar los datos de hoy.</div>'});
</script></body></html>
