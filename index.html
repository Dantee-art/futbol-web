<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arbitrage Scanner</title><style>body{font-family:system-ui;background:#0b1020;color:#eef2ff;margin:0}main{max-width:1100px;margin:auto;padding:24px}h1{margin-bottom:4px}.sub{color:#9ca3af}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}.card{background:#121a2d;border:1px solid #25304a;border-radius:14px;padding:18px;margin:12px 0}.profit{font-size:28px;font-weight:800;color:#52e0a0}.muted{color:#9ca3af}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.out{background:#0d1425;border-radius:10px;padding:12px}.odd{font-size:22px;font-weight:700}.stake{color:#ffd166;font-weight:700}input{background:#0d1425;color:#fff;border:1px solid #33415f;border-radius:8px;padding:10px;width:130px}button{background:#4f7cff;color:#fff;border:0;border-radius:8px;padding:10px 14px}</style></head><body><main><h1>Arbitrage Scanner</h1><div class="sub">Surebets detectadas con cuotas reales. Actualización automática.</div><div class="bar"><label>Banca ARS <input id="bankroll" type="number" min="1" value="100000"></label><button onclick="render()">Recalcular apuestas</button><span id="updated" class="muted"></span></div><div id="stats"></div><div id="list"></div></main><script>let data={};async function render(){data=await fetch('data/arbitrage.json?'+Date.now()).then(r=>r.json());const bankroll=Number(document.getElementById('bankroll').value)||100000;document.getElementById('updated').textContent='Actualizado: '+new Date(data.updated_at).toLocaleString('es-AR');document.getElementById('stats').innerHTML=`<div class="grid"><div class="card"><b>Arbitrajes</b><div class="profit">${data.opportunities.length}</div></div><div class="card"><b>Mejor margen</b><div class="profit">${data.opportunities.length?Math.max(...data.opportunities.map(x=>x.profit_pct)).toFixed(2):'0.00'}%</div></div><div class="card"><b>Banca</b><div class="profit">$ ${bankroll.toLocaleString('es-AR')}</div></div></div>`;document.getElementById('list').innerHTML=data.opportunities.map(o=>{const factor=bankroll/o.bankroll_ars;return `<div class="card"><div class="muted">${o.sport} · ${o.market}</div><h2>${o.event}</h2><div class="profit">+${o.profit_pct.toFixed(2)}%</div><p>Σ probabilidades implícitas: ${(o.implied_sum*100).toFixed(3)}%</p><div class="grid">${o.stakes.map(s=>`<div class="out"><b>${s.name}${s.point!=null?' '+s.point:''}</b><div class="odd">${s.odds.toFixed(2)}</div><div>🏦 ${s.bookmaker}</div><div class="stake">Apostar: $ ${(s.stake_ars*factor).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="muted">Retorno bruto: $ ${(s.gross_return_ars*factor).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div>`).join('')}</div></div>`}).join('')||'<div class="card">No hay arbitrajes confirmados ahora.</div>'}render();</script></body></html>
